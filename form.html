<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>השאירו פרטים — להקת קולות KOLOT</title>
  <meta name="description" content="טופס יצירת קשר עם להקת קולות (KOLOT) — להקת אירועים וחתונות.">
  <meta name="theme-color" content="#0e1b20">
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@300;400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; font-family: 'Assistant', Arial, sans-serif; min-height: 100vh;
      background: var(--f-bg, #0e1b20); color: var(--f-text, #eef7fa);
      display: flex; align-items: flex-start; justify-content: center; padding: 24px 14px;
    }
    .form-card { width: 100%; max-width: 480px; }
    .form-card .logo { max-height: 80px; display: block; margin: 0 auto 10px; }
    h1 { font-size: 22px; text-align: center; color: var(--f-primary, #87cedf); }
    .intro { text-align: center; opacity: .85; font-size: 14.5px; }
    label { display: block; margin: 14px 0 4px; font-size: 14px; opacity: .9; }
    label .req { color: var(--f-primary, #87cedf); }
    .field-help { font-size: 12.5px; opacity: .65; margin: -2px 0 6px; line-height: 1.4; }
    input, select, textarea {
      width: 100%; max-width: 100%; min-width: 0;
      font-family: inherit; font-size: 15px; color: inherit;
      background: rgba(255,255,255,.07); border: 1px solid rgba(255,255,255,.18);
      border-radius: 10px; padding: 10px 12px;
    }
    /* iOS gives date inputs an intrinsic width from their native control, so
       they ignore width:100% and push the page wider than the screen. Dropping
       the native appearance makes them size like every other field. */
    input[type="date"] {
      -webkit-appearance: none; appearance: none;
      min-height: 44px; line-height: 1.2; display: block;
    }
    input[type="date"]::-webkit-date-and-time-value { text-align: start; margin: 0; }
    input[type="date"]::-webkit-calendar-picker-indicator { margin-inline-start: auto; }
    input:focus, select:focus, textarea:focus { outline: none; border-color: var(--f-primary, #87cedf); }
    select option { color: #16232a; }
    /* free-text box revealed by choosing "other" */
    .other-input { margin-top: 8px; }
    /* 48px minimum tap targets — most of this traffic is thumbs on phones */
    .form-nav { display: flex; gap: 10px; margin-top: 22px; }
    .btn-primary, .btn-secondary {
      flex: 1; min-height: 52px; padding: 14px; font-family: inherit; font-size: 16px; font-weight: 700;
      border-radius: 12px; cursor: pointer; border: none;
    }
    .btn-primary { background: var(--f-primary, #87cedf); color: #0b2830; }
    .btn-primary:hover { filter: brightness(1.08); }
    .btn-primary:disabled { opacity: .6; cursor: default; }
    .btn-secondary {
      flex: 0 0 auto; min-width: 96px; background: transparent; color: inherit;
      border: 1px solid rgba(255,255,255,.25);
    }
    input, select, textarea { min-height: 48px; }
    textarea { min-height: 96px; }

    /* multi-step: progress is what makes finishing feel close */
    .progress { height: 6px; border-radius: 99px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 6px; }
    .progress-fill { height: 100%; background: var(--f-primary, #87cedf); width: 0; transition: width .3s ease; }
    .progress-text { font-size: 12.5px; opacity: .7; margin-bottom: 10px; }
    .step-title { font-size: 17px; margin: 4px 0 2px; color: var(--f-primary, #87cedf); }

    /* inline validation */
    .field-error { color: #ff8f8f; font-size: 12.5px; margin-top: 5px; }
    input.invalid, select.invalid, textarea.invalid { border-color: #ff8f8f; }

    .privacy-note { font-size: 12.5px; opacity: .62; text-align: center; margin-top: 12px; line-height: 1.5; }
    .done { text-align: center; padding: 40px 10px; font-size: 18px; }
  </style>
</head>
<body>
  <div class="form-card" id="form-root"><p style="text-align:center;opacity:.7">טוען…</p></div>
  <script>window.__API_BASE__ = 'https://zooglot-backend.up.railway.app';</script>
  <script type="module" src="/js/form.js"></script>
</body>
</html>
